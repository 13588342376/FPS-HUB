<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    (function(){
      var t = localStorage.getItem('fpshub-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/jpeg" href="./assets/images/favicon.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>论坛建设中 | FPS Hub</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    .ph-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .ph-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .ph-card {
      text-align: center;
      max-width: 360px;
    }
    .ph-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 20px;
      filter: grayscale(0.3);
      animation: phFloat 3s ease-in-out infinite;
    }
    .ph-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 6px;
    }
    .ph-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-tertiary);
      font-size: 14px;
      margin: 16px 0 32px;
    }
    .ph-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: phPulse 1.8s ease-in-out infinite;
    }
    .ph-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .ph-back:hover {
      background: var(--accent);
      color: #fff;
    }
    @keyframes phFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes phPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.6); }
    }
    footer { margin-top: auto; }
  </style>
</head>
<body>
  <div class="ph-body">
    <nav class="navbar">
      <div class="logo">
        <a href="index.html" style="color: inherit; text-decoration: none;">FPS HUB</a>
      </div>
      <ul class="nav-links">
        <li id="userStatusWidget" style="display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: rgba(255,255,255,0.05); border-radius: 20px;">
          <span id="widgetAvatar" style="font-size: 18px; line-height: 1;">🐢</span>
          <span id="widgetUsername" style="color: #ccc; font-size: 14px; font-weight: bold;">未登录</span>
          <span id="widgetDot" style="width: 8px; height: 8px; background-color: #ff4b2b; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #ff4b2b;"></span>
        </li>
        <li><button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme(); return false;" title="切换主题"><span class="toggle-icon"></span><span class="toggle-label">??</span></button></li>
        <li><a href="games.html">游戏库</a></li>
        <li><a href="news.html">热点讯息</a></li>
        <li><a href="match.html">组队助手</a></li>
        <li class="nav-join-container">
          <a href="join.html" class="nav-join-btn">👥 加入我们</a>
          <div class="nav-join-submenu">
            <a href="https://qun.qq.com/universal-share/share?ac=1&amp;authKey=jXjnaJmZs3zAfgapzyHPp2ZwPc4QVpMNlYr9Yfo%2BTB949tJ5hzfJ44ekNzn6M8ta&amp;busi_data=eyJncm91cENvZGUiOiI3MDMzOTYwMDYiLCJ0b2tlbiI6IjlsbFM5RTBqVzRQOWlpcWo5WTJKZWQyQnJJNkxzL1hSN0FnbUQyYXUrUEw5eThXWmM2a3VFT09YQXBnSmYzNUQiLCJ1aW4iOiIzNjYxNjg2NTkifQ%3D%3D&amp;data=ZD-B5qIyFcmCADhrLnzD6G_YA5h3e3gyh0UAQoWv2PFkTdUh4Z1ByCwwE3GEmBjM2tm8iiduB4C0uLNukjzBGw&amp;svctype=4&amp;tempid=h5_group_info" target="_blank" class="submenu-item qq-item"><span class="item-icon">💬</span> QQ 交流主群</a>
            <a href="https://t.me/fps_hub1001" target="_blank" class="submenu-item tg-item"><span class="item-icon">✨️</span> Telegram 频道</a>
            <a href="https://discord.gg/Z62Keahzv" target="_blank" class="submenu-item discord-item"><span class="item-icon">🏃</span> Discord 社区</a>
          </div>
        </li>
      </ul>
    </nav>

    <main class="ph-main">
      <div class="ph-card">
        <div class="ph-icon" id="phIcon">🎮</div>
        <h1 class="ph-name" id="phName">游戏</h1>
        <div class="ph-status">
          <span class="ph-dot"></span>
          <span>论坛逐步开放中...</span>
        </div>
        <a href="games.html" class="ph-back">← 返回游戏库</a>
      </div>
    </main>

    <footer><p>&copy; 2026 FPS Hub. 为热爱而生.</p></footer>
  </div>

  <script src="./assets/js/games-data.js"></script>
  <script src="./assets/js/main.js"></script>
  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var id = parseInt(params.get('id'), 10);
      if (id && typeof GAMES_DATABASE !== 'undefined') {
        var game = GAMES_DATABASE.find(function(g){ return g.id === id; });
        if (game) {
          document.getElementById('phIcon').textContent = game.icon || '🎮';
          document.getElementById('phName').textContent = game.name;
          document.title = game.name + ' 论坛建设中 | FPS Hub';
        }
      }
    })();
  </script>
</body>
</html>
