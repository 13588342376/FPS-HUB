<!DOCTYPE html>

    <link rel="stylesheet" href="./assets/css/style.css">
    <style>
        .forum-wrapper { max-width: 1100px; margin: 80px auto 40px; padding: 0 20px; }
        .forum-header { text-align: center; padding: 40px 0 50px; }
        .forum-header .game-icon { font-size: 48px; margin-bottom: 12px; }
        .forum-header h1 { font-size: 32px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .forum-header p { color: var(--text-secondary); font-size: 14px; }
        .forum-stats { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
        .forum-stats span { font-size: 13px; color: var(--text-tertiary); }
        .forum-stats strong { color: var(--accent); font-weight: 600; }

        .forum-categories { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .category-card { background: var(--bg-card); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px 24px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; }
        .category-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); transform: translateY(-2px); }
        .category-left { display: flex; align-items: center; gap: 16px; }
        .category-icon { font-size: 24px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--tag-bg); border-radius: 10px; }
        .category-info h3 { font-size: 15px; font-weight: 600; color: var(--text-primary); margin: 0 0 4px; }
        .category-info p { font-size: 12px; color: var(--text-tertiary); margin: 0; }
        .category-meta { text-align: right; font-size: 12px; color: var(--text-tertiary); }
        .category-meta .count { display: block; font-weight: 600; color: var(--text-secondary); }

        .topic-list { display: flex; flex-direction: column; gap: 10px; }
        .topic-row { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 10px; padding: 16px 20px; transition: all 0.2s ease; cursor: pointer; }
        .topic-row:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
        .topic-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin: 0 0 6px; }
        .topic-meta { display: flex; gap: 16px; font-size: 12px; color: var(--text-tertiary); }
        .topic-meta .author { color: var(--accent); }
        .topic-meta .tag { background: var(--tag-bg); padding: 2px 8px; border-radius: 4px; color: var(--text-secondary); font-size: 11px; }

        .forum-sidebar { font-size: 13px; color: var(--text-secondary); line-height: 1.8; }
        .back-link { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>

            }
        };

        function getGameParam() {
            const params = new URLSearchParams(window.location.search);
            return params.get("game") || "cs2";
        }

        function loadForum() {
            const gameKey = getGameParam();
            const data = GAME_DATA[gameKey] || GAME_DATA["cs2"];

            document.getElementById("gameIcon").textContent = data.icon;
            document.getElementById("gameTitle").textContent = `${data.emoji} ${data.name} 本站论坛`;
            document.getElementById("gameDesc").textContent = data.desc;
            document.getElementById("topicCount").textContent = data.topics.toLocaleString();
            document.getElementById("postCount").textContent = data.posts.toLocaleString();
            document.getElementById("onlineCount").textContent = data.online;

            const container = document.getElementById("forumContent");
            let html = "<h2 style='font-size:18px;font-weight:600;margin-bottom:16px;color:var(--text-primary);'>📂 论坛板块</h2>";
            html += '<div class="forum-categories">';
            data.categories.forEach(cat => {
                html += `<div class="category-card">
                    <div class="category-left">
                        <div class="category-icon" style="background:${cat.iconBg}20;color:${cat.iconBg}">${cat.icon}</div>
                        <div class="category-info"><h3>${cat.name}</h3><p>${cat.desc}</p></div>
                    </div>
                    <div class="category-meta"><span class="count">${cat.threads}</span>篇</div>
                </div>`;
            });
            html += "</div>";

            html += "<h2 style='font-size:18px;font-weight:600;margin:30px 0 16px;color:var(--text-primary);'>📜 最新帖子</h2>";
            html += '<div class="topic-list">';
            data.recentTopics.forEach(topic => {
                html += `<div class="topic-row" onclick="window.open('${topic.url}','_blank')">
                    <h4 class="topic-title">${topic.title}</h4>
                    <div class="topic-meta">
                        <span class="author">👤 ${topic.author}</span>
                        <span>💬 ${topic.replies} 回复</span>
                        <span>🕐 ${topic.time}</span>
                        <span class="tag">${topic.tag}</span>
                    </div>
                </div>`;
            });
            html += "</div>";

            html += '<div style="background:var(--bg-tertiary);border-radius:12px;padding:30px;text-align:center;margin-top:30px;">';
            html += '<p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px;">还没找到开黑伙伴？加入社区一起玩吧！</p>';
            html += '<a href="join.html" class="btn" style="display:inline-block;margin-top:0;">加入社区找队友 👉</a>';
            html += "</div>";

            container.innerHTML = html;
        }

        document.addEventListener("DOMContentLoaded", loadForum);
    </script>
